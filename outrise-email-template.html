<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="supported-color-schemes" content="dark" />
    <title>Outrise Support</title>
    <style>
      body, table, td, p, h1 { margin: 0; padding: 0; }
      table { border-collapse: collapse; }
      @media only screen and (max-width: 600px) {
        .outer-padding { padding: 24px 12px !important; }
        .card-padding { padding: 28px 22px !important; }
        .message-padding { padding: 20px !important; }
        .email-title { font-size: 26px !important; line-height: 34px !important; }
      }
    </style>
  </head>
  <!--
    OUTRISE / RESEND TEMPLATE SETUP

    Import: Resend > Templates > Create template, then paste or drag in this file.
    Suggested template name/alias: outrise-support-response
    Sender (after domain verification): Outrise Support <support@outrisefitness.com>
    Set the email subject in Resend or supply it when sending through the API.

    Define these custom variables as strings in Resend:
      RECIPIENT_NAME: the user's first name or username; fallback: there
      SUBJECT:       the message heading; fallback: An update from Outrise
      MESSAGE:       the actual support response; supply this for every email

    Example test values:
      RECIPIENT_NAME: Caleb
      SUBJECT:       We've reviewed your account
      MESSAGE:       Thanks for reaching out. We've reviewed your report and
                     restored access to your account. You can sign in again.

    Resend's documented HTML variable syntax is {{{VARIABLE_NAME}}}.
    Before sending, HTML-escape dynamic text (including &, <, >, and quotes).
    Keep MESSAGE as escaped plain text. This template preserves its newlines.
    Do not pass raw user-supplied HTML as any variable.

    Documentation:
      https://resend.com/docs/dashboard/templates/create-template
      https://resend.com/docs/dashboard/templates/template-variables

    Fonts use installed Barlow faces where available, with email-safe fallbacks.
    Receiving replies requires a configured mailbox, forwarding, or inbound route.
  -->
  <body style="margin: 0; padding: 0; width: 100%; background-color: #03060A; color: #B7C0C9; -webkit-text-size-adjust: 100%;">
    <div style="display: none; max-height: 0; overflow: hidden; opacity: 0; mso-hide: all;">
      An update from the Outrise support team.
    </div>

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#03060A" style="width: 100%; background-color: #03060A;">
      <tr>
        <td class="outer-padding" align="center" style="padding: 48px 20px;">
          <!--[if mso]>
          <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"><tr><td>
          <![endif]-->
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width: 100%; max-width: 600px;">
            <tr>
              <td style="padding: 0 0 24px; font-family: 'Barlow Condensed', 'Arial Narrow', Arial, sans-serif; font-size: 30px; line-height: 36px; font-weight: 800; letter-spacing: 4px; color: #F1F5F9;">
                OUTRISE
              </td>
            </tr>
            <tr>
              <td bgcolor="#050B14" style="background-color: #050B14; border: 1px solid #162636; border-top: 3px solid #8C1A35;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width: 100%;">
                  <tr>
                    <td class="card-padding" style="padding: 36px 36px 32px;">
                      <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                        <tr>
                          <td width="6" valign="middle" style="width: 6px;">
                            <div style="width: 6px; height: 6px; border-radius: 3px; background-color: #8C1A35;"></div>
                          </td>
                          <td style="padding-left: 10px; font-family: 'Barlow', Arial, sans-serif; font-size: 11px; line-height: 18px; font-weight: 700; letter-spacing: 1.6px; color: #9BA7B2;">
                            OUTRISE // SUPPORT
                          </td>
                        </tr>
                      </table>

                      <h1 class="email-title" style="margin: 18px 0 24px; font-family: 'Barlow Condensed', 'Arial Narrow', Arial, sans-serif; font-size: 30px; line-height: 38px; font-weight: 700; letter-spacing: 0.2px; color: #F1F5F9; overflow-wrap: anywhere;">
                        {{{SUBJECT}}}
                      </h1>

                      <p style="margin: 0 0 18px; font-family: 'Barlow', Arial, sans-serif; font-size: 16px; line-height: 26px; color: #D3DBE3; overflow-wrap: anywhere;">
                        Hey {{{RECIPIENT_NAME}}},
                      </p>

                      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#060D17" style="width: 100%; background-color: #060D17; border: 1px solid #1B334A;">
                        <tr>
                          <td class="message-padding" style="padding: 24px; font-family: 'Barlow', Arial, sans-serif; font-size: 16px; line-height: 27px; color: #C5CED7; white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word;">{{{MESSAGE}}}</td>
                        </tr>
                      </table>

                      <p style="margin: 24px 0 0; font-family: 'Barlow', Arial, sans-serif; font-size: 15px; line-height: 24px; color: #B7C0C9;">
                        The Outrise Support Team
                      </p>
                    </td>
                  </tr>
                  <tr>
                    <td class="card-padding" style="padding: 22px 36px; border-top: 1px solid #162636; font-family: 'Barlow', Arial, sans-serif; font-size: 13px; line-height: 22px; color: #9BA7B2;">
                      Need more help? Use <strong style="font-weight: 700; color: #C5CED7;">Report an issue</strong> on Outrise's sign-in screen.
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding: 26px 16px 0;">
                <p style="margin: 0 0 8px; font-family: 'Barlow', Arial, sans-serif; font-size: 11px; line-height: 18px; font-weight: 700; letter-spacing: 1.8px; color: #9BA7B2;">
                  RISE BEYOND. GET BETTER.
                </p>
                <p style="margin: 0; font-family: 'Barlow', Arial, sans-serif; font-size: 12px; line-height: 20px; color: #9BA7B2;">
                  outrisefitness.com
                </p>
              </td>
            </tr>
          </table>
          <!--[if mso]>
          </td></tr></table>
          <![endif]-->
        </td>
      </tr>
    </table>
  </body>
</html>
